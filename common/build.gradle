plugins { id 'java-library' }
group = 'com.glowingfederal.soundtrackselector'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
repositories { mavenCentral() }
dependencies { compileOnly 'com.google.code.gson:gson:2.2.4'; testImplementation 'junit:junit:4.13.2'; testRuntimeOnly 'com.google.code.gson:gson:2.2.4' }
compileJava { options.release = 8; options.encoding = 'UTF-8' }
compileTestJava { options.release = 8; options.encoding = 'UTF-8' }
tasks.withType(JavaCompile).configureEach {
    // Java 8 is intentional; keep source warnings and all other diagnostics visible.
    options.compilerArgs.add('-Xlint:-options')
}
// No Minecraft or loader dependencies belong in this project.
apply from: '../build-logic/java8-verification.gradle'
